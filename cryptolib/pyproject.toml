[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolib"
version = "1.0.0"
description = "Спільна бібліотека лабораторної №6: сервіси RSA та AES і опис протоколу безпечного каналу"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]
