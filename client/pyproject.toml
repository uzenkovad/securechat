[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securechat-client"
version = "1.1.0"
description = "Консольний клієнт лабораторних №6–7: шифрований канал із сервером"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "cryptolib"]

[project.scripts]
securechat-client = "securechat_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
