name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Збірка та unit-тести (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            cryptolib/pyproject.toml
            server/pyproject.toml
            client/pyproject.toml
            requirements-dev.txt

      - name: Встановлення бібліотеки, сервера й клієнта
        run: pip install -r requirements-dev.txt

      - name: Unit-тести
        run: pytest

  docker:
    name: Збірка Docker-образу сервера
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Збірка образу
        run: docker build -f server/Dockerfile -t securechat-server .

      - name: Запуск контейнера й перевірка /health
        run: |
          docker run -d --name server -p 8000:8000 securechat-server
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs server
          exit 1
